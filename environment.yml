# Cross-platform environment for this project (main packages only, exact versions used in the analysis).
# The complete Windows export is in environment_full_windows.yml.
name: blastoid
channels:
  - conda-forge
dependencies:
  - python=3.11
  - scanpy=1.11.5
  - anndata=0.12.19
  - numpy=2.4.6
  - pandas=2.3.3
  - scipy=1.17.1
  - scikit-learn=1.9.1
  - umap-learn=0.5.12
  - pynndescent=0.6.0
  - numba=0.67.0
  - h5py=3.16.0
  - matplotlib-base=3.11.2
  - seaborn=0.13.2
  - statsmodels=0.15.0
  - jupyterlab=4.6.4
  - ipykernel=7.3.0
  - pip
  - pip:
      - igraph==1.0.0
      - scikit-image==0.26.0
